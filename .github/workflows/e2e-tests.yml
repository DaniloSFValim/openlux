name: E2E Tests (Playwright)

on:
  push:
    branches: [ main, develop, feature/*, claude/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit || npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox --with-deps

      # Os dois passos que subiam o http-server na mao sairam: playwright.config.js
      # ja declara `webServer`, que sobe o servidor E espera a URL responder
      # antes do primeiro teste. Os passos manuais usavam `sleep 2` com
      # continue-on-error, entao um servidor lento passava como pronto e os
      # testes comecavam contra uma porta morta.

      # Sem o `|| true` que estava aqui: ele fazia o passo terminar com sucesso
      # mesmo com testes falhando. Um job verde sobre uma suite vermelha e pior
      # que um job vermelho, porque ninguem vai olhar.
      - name: Run E2E Tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: 'http://localhost:8000'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsFile = './test-results/results.json';

            if (!fs.existsSync(resultsFile)) {
              return;
            }

            const results = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));
            const stats = results.stats || {};
            const passed = stats.expected || 0;
            const failed = stats.unexpected || 0;
            const skipped = stats.skipped || 0;
            const flaky = stats.flaky || 0;
            const total = passed + failed + skipped + flaky;

            const comment = [
              '## 🧪 E2E Test Results',
              '',
              `- Total Tests: ${total}`,
              `- Passed: ${passed}`,
              `- Failed: ${failed}`,
              `- Skipped: ${skipped}`,
              '',
              '[📊 Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

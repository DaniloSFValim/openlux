[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlux"
version = "0.1.0"
description = "Estimativa de poluicao luminosa baseada em sensoriamento remoto para o Estado do Rio de Janeiro"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Danilo Valim" }]
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "numpy",
    "pandas",
    "h5py",
    "rasterio",
    "geopandas",
    "exactextract",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]
web-tests = ["playwright"]  # teste da interface em navegador (opcional)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

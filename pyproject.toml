[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlux"
version = "0.1.0"
description = "Estimativa de poluicao luminosa baseada em sensoriamento remoto para o Estado do Rio de Janeiro"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Danilo Valim" }]
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
# Versões mínimas = as que foram executadas e aprovadas na suíte (ambiente de referência, Python 3.13.18).
# Ambiente completo e fixado: requirements-lock.txt.
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "h5py>=3.16.0",
    "rasterio>=1.5.2",
    "geopandas>=1.2.0",
    "shapely>=2.2.0",
    "pyproj>=3.8.0",
    "exactextract>=0.3.0",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pyyaml>=6.0.1", "cffconvert>=2.0.0"]  # cffconvert traz o esquema CFF 1.2.0 usado em tests/test_docs_consistency.py; jsonschema vem como dependência dele
web-tests = ["playwright>=1.65.2"]  # teste da interface em navegador (opcional)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
